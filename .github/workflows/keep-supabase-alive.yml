name: Keep Supabase Alive

on:
  schedule:
    # Jalan tiap 3 hari jam 00:00 UTC (reset timer 7 hari Supabase free tier)
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        run: |
          SUPABASE_URL="${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL }}"
          SUPABASE_KEY="${{ secrets.VITE_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}"

          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Error: Secrets VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY belum diset di GitHub Secrets!"
            exit 1
          fi

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            --retry 3 --retry-delay 5 --retry-all-errors \
            -X GET "$SUPABASE_URL/rest/v1/projects?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" || echo "000")

          echo "Status: $HTTP_CODE"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Supabase aktif. Timer 7 hari berhasil direset."
          else
            echo "Gagal ping Supabase. Status: $HTTP_CODE"
            exit 1
          fi
